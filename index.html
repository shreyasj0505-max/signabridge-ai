  <!-- Main Application Script (Babel Transpiled) -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 1. ASL CATALOG DATA ---
    const ASL_SIGNS = [
      { id: "sign_ily", sign: "I Love You", category: "phrase", name: "I Love You (ILY)", summary: "Thumb, index, and pinky extended; middle and ring folded.", instructions: "Extend thumb, index, and pinky straight out. Fold middle and ring fingers flat into palm.", tips: "Universal ASL symbol combining I, L, and Y.", difficulty: "Beginner" },
      { id: "sign_hello", sign: "Hello", category: "greeting", name: "Hello / Hi", summary: "Open flat hand with all 5 fingers spread, waving or saluting.", instructions: "Hold open hand with all 5 fingers extended and spread forward.", tips: "Keep fingers straight facing the camera.", difficulty: "Beginner" },
      { id: "sign_v", sign: "V", category: "alphabet", name: "Letter V / Peace", summary: "Index and middle fingers up in a 'V' peace sign.", instructions: "Extend index and middle straight up and spread apart in a 'V'. Fold other fingers.", tips: "Classic peace sign.", difficulty: "Beginner" },
      { id: "sign_yes", sign: "Yes", category: "phrase", name: "Yes (Thumbs Up)", summary: "Upright closed fist with thumb up.", instructions: "Make a fist with your thumb pointing straight up in a thumbs-up approval sign.", tips: "Keep thumb vertical and clear.", difficulty: "Beginner" },
      { id: "sign_no", sign: "No", category: "phrase", name: "No (Thumbs Down)", summary: "Closed fist with thumb pointing down.", instructions: "Hold fist with thumb pointing downward.", tips: "Clear negation signal.", difficulty: "Beginner" },
      { id: "sign_ok", sign: "OK", category: "phrase", name: "OK / Perfect (F)", summary: "Pinch index and thumb with 3 outer fingers up.", instructions: "Touch tip of thumb and index into a ring, other 3 fingers straight up.", tips: "Same handshape as letter F.", difficulty: "Beginner" },
      { id: "sign_l", sign: "L", category: "alphabet", name: "Letter L", summary: "Thumb and index finger extended at 90 degrees.", instructions: "Extend index finger straight up and thumb straight out sideways forming an 'L'.", tips: "Keep other 3 fingers curled.", difficulty: "Beginner" },
      { id: "sign_y", sign: "Y", category: "alphabet", name: "Letter Y", summary: "Thumb and pinky extended, middle 3 fingers curled.", instructions: "Extend thumb and pinky fully outward (shaka/hang loose sign). Curl index, middle, ring.", tips: "Palm facing forward.", difficulty: "Beginner" },
      { id: "sign_i", sign: "I", category: "alphabet", name: "Letter I", summary: "Pinky straight up, all other fingers closed in fist.", instructions: "Curl index, middle, ring with thumb over them. Extend only pinky straight up.", tips: "Keep pinky as vertical as possible.", difficulty: "Beginner" },
      { id: "sign_d", sign: "D", category: "alphabet", name: "Letter D / Point", summary: "Index pointing up, thumb touching middle fingertip.", instructions: "Point index finger straight up. Touch thumb to middle and ring fingertips.", tips: "Only index points up.", difficulty: "Intermediate" },
      { id: "sign_w", sign: "W", category: "alphabet", name: "Letter W / 3", summary: "Index, middle, and ring fingers extended up in a 'W'.", instructions: "Extend index, middle, and ring straight up and spread. Pinky down with thumb.", tips: "Ensure three fingers are clearly separated.", difficulty: "Beginner" },
      { id: "sign_b", sign: "B", category: "alphabet", name: "Letter B / 4", summary: "Flat open hand, 4 fingers straight up, thumb folded.", instructions: "Hold 4 fingers straight up and pressed together. Fold thumb flat across palm.", tips: "Keep 4 fingers together without spreading them.", difficulty: "Beginner" },
      { id: "sign_a", sign: "A", category: "alphabet", name: "Letter A", summary: "Fist with thumb resting upright on side of index.", instructions: "Make a loose fist with fingers curled tightly. Keep thumb straight along the index finger.", tips: "Keep thumb along side, not across front.", difficulty: "Beginner" },
      { id: "sign_c", sign: "C", category: "alphabet", name: "Letter C", summary: "Hand curved to form shape of letter 'C'.", instructions: "Curve all 4 fingers and thumb to form an open arc resembling capital C.", tips: "Ensure the circular arc opening is clear.", difficulty: "Beginner" },
      { id: "sign_stop", sign: "Stop", category: "phrase", name: "Stop", summary: "Open flat palm facing outward toward camera.", instructions: "Hold all five fingers upright and press flat palm toward camera.", tips: "Clear boundary sign.", difficulty: "Beginner" },
      { id: "sign_help", sign: "Help", category: "phrase", name: "Help", summary: "Upright thumb fist held high.", instructions: "Hold upright thumb fist indicating request for assistance.", tips: "Keep hand centered in view.", difficulty: "Beginner" },
      { id: "sign_thank_you", sign: "Thank You", category: "greeting", name: "Thank You", summary: "Flat hand touching chin, then moving forward.", instructions: "Touch flat fingertips to chin or lips, then move outward toward person.", tips: "Gentle forward motion.", difficulty: "Beginner" }
    ];

    const CATEGORIES = [
      { id: "all", label: "All Signs" },
      { id: "alphabet", label: "Alphabet (A-Z)" },
      { id: "greeting", label: "Greetings" },
      { id: "phrase", label: "Phrases & Daily" }
    ];

    // --- 2. HIGH-ACCURACY COMPUTER VISION ASL ENGINE ---
    const LM = {
      WRIST: 0,
      THUMB_CMC: 1, THUMB_MCP: 2, THUMB_IP: 3, THUMB_TIP: 4,
      INDEX_MCP: 5, INDEX_PIP: 6, INDEX_DIP: 7, INDEX_TIP: 8,
      MIDDLE_MCP: 9, MIDDLE_PIP: 10, MIDDLE_DIP: 11, MIDDLE_TIP: 12,
      RING_MCP: 13, RING_PIP: 14, RING_DIP: 15, RING_TIP: 16,
      PINKY_MCP: 17, PINKY_PIP: 18, PINKY_DIP: 19, PINKY_TIP: 20
    };

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [5, 9], [9, 10], [10, 11], [11, 12],
      [9, 13], [13, 14], [14, 15], [15, 16],
      [13, 17], [0, 17], [17, 18], [18, 19], [19, 20]
    ];

    function dist(p1, p2) {
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      const dz = (p1.z || 0) - (p2.z || 0);
      return Math.sqrt(dx * dx + dy * dy + dz * dz);
    }

    /**
     * Upgraded, robust feature extractor:
     * Evaluates relative joint distances and finger extension ratios.
     * Invariant to hand size, distance from camera, and slight tilt.
     */
    function extractHandFeatures(rawLandmarks) {
      if (!rawLandmarks || rawLandmarks.length < 21) return null;

      const wrist = rawLandmarks[0];
      const middleMcp = rawLandmarks[LM.MIDDLE_MCP];
      const scale = dist(wrist, middleMcp) || 1.0;

      // Scale-normalized coordinates relative to wrist
      const norm = rawLandmarks.map(p => ({
        x: (p.x - wrist.x) / scale,
        y: (p.y - wrist.y) / scale,
        z: ((p.z || 0) - (wrist.z || 0)) / scale
      }));

      // Multi-factor finger extension calculation:
      // Compare tip distance from wrist against PIP distance from wrist
      const checkExtension = (tipIdx, pipIdx, mcpIdx) => {
        const dWristTip = dist(norm[0], norm[tipIdx]);
        const dWristPip = dist(norm[0], norm[pipIdx]);
        const dMcpTip = dist(norm[mcpIdx], norm[tipIdx]);
        const dMcpPip = dist(norm[mcpIdx], norm[pipIdx]);

        // Ratio of tip distance to PIP distance from wrist
        const ratio = dWristTip / (dWristPip || 1.0);
        // Finger is open if tip is clearly further from wrist than PIP
        return ratio > 1.12 || (dMcpTip > dMcpPip * 1.35);
      };

      const indexOpen = checkExtension(LM.INDEX_TIP, LM.INDEX_PIP, LM.INDEX_MCP);
      const middleOpen = checkExtension(LM.MIDDLE_TIP, LM.MIDDLE_PIP, LM.MIDDLE_MCP);
      const ringOpen = checkExtension(LM.RING_TIP, LM.RING_PIP, LM.RING_MCP);
      const pinkyOpen = checkExtension(LM.PINKY_TIP, LM.PINKY_PIP, LM.PINKY_MCP);

      // Thumb extension calculation
      const dThumbTipPinkyMcp = dist(norm[LM.THUMB_TIP], norm[LM.PINKY_MCP]);
      const dThumbIpPinkyMcp = dist(norm[LM.THUMB_IP], norm[LM.PINKY_MCP]);
      const dThumbTipIndexMcp = dist(norm[LM.THUMB_TIP], norm[LM.INDEX_MCP]);
      const thumbOpen = (dThumbTipPinkyMcp > dThumbIpPinkyMcp * 1.15) && (dThumbTipIndexMcp > 0.40);

      // Inter-finger distances
      const dThumbIndex = dist(norm[LM.THUMB_TIP], norm[LM.INDEX_TIP]);
      const dThumbMiddle = dist(norm[LM.THUMB_TIP], norm[LM.MIDDLE_TIP]);
      const dIndexMiddle = dist(norm[LM.INDEX_TIP], norm[LM.MIDDLE_TIP]);

      // Pinch check (thumb touching index)
      const isPinching = dThumbIndex < 0.28;

      // Thumb vertical orientation (tip higher than MCP in camera view: y is 0 at top)
      const thumbPointingUp = norm[LM.THUMB_TIP].y < norm[LM.THUMB_MCP].y;

      return {
        norm,
        states: {
          thumb: thumbOpen ? "OPEN" : "CLOSED",
          index: indexOpen ? "OPEN" : "CLOSED",
          middle: middleOpen ? "OPEN" : "CLOSED",
          ring: ringOpen ? "OPEN" : "CLOSED",
          pinky: pinkyOpen ? "OPEN" : "CLOSED"
        },
        distances: {
          thumbIndex: dThumbIndex,
          thumbMiddle: dThumbMiddle,
          indexMiddle: dIndexMiddle,
          thumbTipIndexMcp: dThumbTipIndexMcp
        },
        isPinching,
        thumbPointingUp
      };
    }

    /**
     * Upgraded classification logic with enhanced coverage and flexible thresholds
     */
    function classifyASLGesture(rawLandmarks, handedness = "Right", minConf = 0.55) {
      const feat = extractHandFeatures(rawLandmarks);
      if (!feat) return null;

      const { thumb, index, middle, ring, pinky } = feat.states;
      const t = thumb === "OPEN";
      const i = index === "OPEN";
      const m = middle === "OPEN";
      const r = ring === "OPEN";
      const p = pinky === "OPEN";
      const d = feat.distances;

      let sign = "Detecting...";
      let category = "alphabet";
      let confidence = 0.50;
      let meaning = "Hold hand clearly facing camera";

      // 1. I Love You (ILY): Thumb, Index, Pinky OPEN; Middle & Ring CLOSED
      if (t && i && !m && !r && p) {
        sign = "I Love You"; category = "phrase"; confidence = 0.96; meaning = "Universal ASL symbol for 'I Love You'";
      }
      // 2. Y / Shaka: Thumb and Pinky OPEN; others CLOSED
      else if (t && !i && !m && !r && p) {
        sign = "Y"; category = "alphabet"; confidence = 0.95; meaning = "ASL Letter 'Y'";
      }
      // 3. L: Thumb & Index OPEN; others CLOSED
      else if (t && i && !m && !r && !p) {
        sign = "L"; category = "alphabet"; confidence = 0.96; meaning = "ASL Letter 'L' (Thumb & Index angle)";
      }
      // 4. I: Only Pinky OPEN; others CLOSED
      else if (!t && !i && !m && !r && p) {
        sign = "I"; category = "alphabet"; confidence = 0.94; meaning = "ASL Letter 'I'";
      }
      // 5. V / Peace: Index & Middle OPEN; others CLOSED
      else if (!t && i && m && !r && !p) {
        if (d.indexMiddle > 0.20) {
          sign = "V"; category = "alphabet"; confidence = 0.95; meaning = "ASL Letter 'V' / Peace / Number 2";
        } else {
          sign = "U"; category = "alphabet"; confidence = 0.92; meaning = "ASL Letter 'U' (Fingers together)";
        }
      }
      // 6. W / 3: Index, Middle, Ring OPEN; Pinky & Thumb CLOSED
      else if (!t && i && m && r && !p) {
        sign = "W"; category = "alphabet"; confidence = 0.94; meaning = "ASL Letter 'W' / Number 3";
      }
      // 7. B / 4: 4 fingers OPEN, Thumb folded
      else if (!t && i && m && r && p) {
        sign = "B"; category = "alphabet"; confidence = 0.95; meaning = "ASL Letter 'B' / Flat Hand";
      }
      // 8. Hello / Open Hand / Stop: All 5 fingers OPEN
      else if (t && i && m && r && p) {
        sign = "Hello"; category = "greeting"; confidence = 0.97; meaning = "Open Palm / 'Hello' greeting / Stop";
      }
      // 9. OK / F: Thumb and Index touching (pinch), 3 outer fingers OPEN
      else if (feat.isPinching && m && r && p) {
        sign = "OK"; category = "phrase"; confidence = 0.95; meaning = "ASL Letter 'F' / 'OK' gesture";
      }
      // 10. D / Point / 1: Index OPEN, others CLOSED
      else if (!t && i && !m && !r && !p) {
        sign = "D"; category = "alphabet"; confidence = 0.93; meaning = "ASL Letter 'D' / Point / Number 1";
      }
      // 11. Thumbs Up (Yes) / Thumbs Down (No): Only Thumb OPEN
      else if (t && !i && !m && !r && !p) {
        if (feat.thumbPointingUp) {
          sign = "Yes"; category = "phrase"; confidence = 0.96; meaning = "Thumbs Up / 'Yes' affirmation";
        } else {
          sign = "No"; category = "phrase"; confidence = 0.92; meaning = "Thumbs Down / 'No' negation";
        }
      }
      // 12. A vs S: All fingers closed (fist)
      else if (!i && !m && !r && !p) {
        if (d.thumbTipIndexMcp < 0.40) {
          sign = "A"; category = "alphabet"; confidence = 0.90; meaning = "ASL Letter 'A' (Fist with thumb on side)";
        } else {
          sign = "S"; category = "alphabet"; confidence = 0.88; meaning = "ASL Letter 'S' (Thumb across fingers)";
        }
      }
      // 13. C: Arc curve with all fingers bent
      else if (d.thumbIndex > 0.28 && d.thumbIndex < 0.60 && !i && !m) {
        sign = "C"; category = "alphabet"; confidence = 0.88; meaning = "ASL Letter 'C' (Curved arc hand)";
      }

      return {
        sign,
        category,
        confidence: Math.round(confidence * 100),
        meaning,
        fingerStates: feat.states,
        handedness,
        isRecognized: confidence >= minConf
      };
    }

    /**
     * Draw neon electric blue & cyan skeleton on Canvas
     */
    function drawNeonSkeleton(ctx, landmarks, width, height, handedness = "Right") {
      if (!ctx || !landmarks || landmarks.length < 21) return;
      ctx.save();
      
      // Electric Blue & Cyan Shadow Glow
      ctx.shadowBlur = 14;
      ctx.shadowColor = handedness === "Left" ? "#3B82F6" : "#06B6D4";

      // Draw Bones
      HAND_CONNECTIONS.forEach(([s, e]) => {
        const p1 = landmarks[s];
        const p2 = landmarks[e];
        const x1 = p1.x * width;
        const y1 = p1.y * height;
        const x2 = p2.x * width;
        const y2 = p2.y * height;

        const grad = ctx.createLinearGradient(x1, y1, x2, y2);
        grad.addColorStop(0, "#1D4ED8");
        grad.addColorStop(0.5, "#2563EB");
        grad.addColorStop(1, "#38BDF8");

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 3.5;
        ctx.lineCap = "round";
        ctx.stroke();
      });

      // Draw Glowing Joints
      landmarks.forEach((p, idx) => {
        const cx = p.x * width;
        const cy = p.y * height;
        const isTip = [4, 8, 12, 16, 20].includes(idx);
        const radius = isTip ? 6.5 : (idx === 0 ? 7 : 4);

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
        ctx.fillStyle = isTip ? "#38BDF8" : "#FFFFFF";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, radius + 2, 0, 2 * Math.PI);
        ctx.strokeStyle = "#2563EB";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });
      ctx.restore();
    }

    // --- 3. SPEECH SERVICES ---
    const speechService = {
      synth: typeof window !== "undefined" ? window.speechSynthesis : null,
      speak(text, { onStart, onEnd, onError } = {}) {
        if (!this.synth || !text) return false;
        this.synth.cancel();
        const utt = new SpeechSynthesisUtterance(text.trim());
        const voices = this.synth.getVoices();
        const enVoice = voices.find(v => v.lang.startsWith("en-US") || v.lang.startsWith("en-GB"));
        if (enVoice) utt.voice = enVoice;
        if (onStart) utt.onstart = onStart;
        if (onEnd) utt.onend = onEnd;
        if (onError) utt.onerror = onError;
        this.synth.speak(utt);
        return true;
      },
      playChime() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } catch (e) {}
      }
    };

    // --- 4. HISTORY STORAGE ---
    const historyStorage = {
      KEY: "signabridge_history",
      get() {
        try {
          const d = localStorage.getItem(this.KEY);
          return d ? JSON.parse(d) : [];
        } catch (e) { return []; }
      },
      add(entry) {
        try {
          const h = this.get();
          const item = {
            id: "t_" + Date.now(),
            text: entry.text,
            confidence: entry.confidence || 95,
            mode: entry.mode || "live_camera",
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };
          const updated = [item, ...h].slice(0, 100);
          localStorage.setItem(this.KEY, JSON.stringify(updated));
          return updated;
        } catch (e) { return []; }
      },
      delete(id) {
        try {
          const updated = this.get().filter(i => i.id !== id);
          localStorage.setItem(this.KEY, JSON.stringify(updated));
          return updated;
        } catch (e) { return []; }
      },
      clear() {
        localStorage.removeItem(this.KEY);
        return [];
      }
    };

    // --- 5. COMPONENT: NAVBAR ---
    function Navbar({ activePage, setActivePage, soundEnabled, setSoundEnabled }) {

      const navs = [
        { id: 'home', label: 'Home', icon: '⚡' },
        { id: 'translator', label: 'Live Translator', icon: '📹' },
        { id: 'learn', label: 'Learn Signs', icon: '📖' },
        { id: 'speech', label: 'Speech Converter', icon: '🎙️' },
        { id: 'history', label: 'History', icon: '📜' },
        { id: 'about', label: 'About', icon: 'ℹ️' },
      ];

      return (
        <header className="sticky top-0 z-50 backdrop-blur-xl bg-black/90 border-b border-blue-900/40">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex items-center justify-between h-16">
              
              {/* Brand Logo in Electric Blue & Black */}
              <div onClick={() => setActivePage('home')} className="flex items-center gap-3 cursor-pointer group">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-700 via-blue-600 to-cyan-400 p-[2px] shadow-lg shadow-blue-600/30 group-hover:scale-105 transition-transform">
                  <div className="w-full h-full bg-black rounded-[10px] flex items-center justify-center text-xl">
                    🤟
                  </div>
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-blue-100 to-cyan-300 bg-clip-text text-transparent">
                      SignaBridge
                    </span>
                    <span className="px-1.5 py-0.5 text-[10px] font-semibold uppercase rounded bg-gradient-to-r from-blue-600 to-cyan-500 text-white shadow-sm">
                      AI
                    </span>
                  </div>
                  <p className="text-[10px] text-blue-300 hidden sm:block tracking-wide">Electric Vision Sign System</p>
                </div>
              </div>

              {/* Desktop Nav */}
              <nav className="hidden md:flex items-center gap-1 bg-[#050B1A] p-1.5 rounded-2xl border border-blue-900/50">
                {navs.map((n) => (
                  <button
                    key={n.id}
                    onClick={() => setActivePage(n.id)}
                    className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl text-sm font-medium transition-all ${
                      activePage === n.id
                        ? 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-md shadow-blue-600/30 font-semibold'
                        : 'text-slate-300 hover:text-white hover:bg-white/5'
                    }`}
                  >
                    <span>{n.icon}</span>
                    <span>{n.label}</span>
                  </button>
                ))}
              </nav>

              {/* Utility Buttons */}
              <div className="hidden sm:flex items-center gap-2">
                <button
                  onClick={() => setSoundEnabled(!soundEnabled)}
                  title="Toggle audio feedback"
                  className={`p-2 rounded-xl border text-xs transition-all ${
                    soundEnabled ? 'bg-blue-950/60 border-blue-500/40 text-cyan-300' : 'bg-black border-slate-800 text-slate-500'
                  }`}
                >
                  {soundEnabled ? '🔊 Audio ON' : '🔇 Audio OFF'}
                </button>

                <button
                  onClick={() => setActivePage('translator')}
                  className="flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-blue-600 via-blue-500 to-cyan-500 text-white text-xs font-semibold shadow-lg shadow-blue-600/30 hover:opacity-95"
                >
                  <span>📹 Launch Live</span>
                </button>
              </div>

    // --- 7. COMPONENT: LIVE TRANSLATOR (UPGRADED AI ENGINE) ---
    function LiveTranslator({ soundEnabled }) {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const streamRef = useRef(null);
      const animRef = useRef(null);
      const handsRef = useRef(null);
      const isProcessingFrameRef = useRef(false);

      const [isCameraActive, setIsCameraActive] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [handDetected, setHandDetected] = useState(false);
      const [fps, setFps] = useState(0);

      const [prediction, setPrediction] = useState({
        sign: "No Hand Detected",
        category: "none",
        confidence: 0,
        meaning: "Click 'Start Camera' to begin recognizing gestures.",
        handedness: "Right",
        fingerStates: null
      });

      const [sentence, setSentence] = useState("");
      const [copied, setCopied] = useState(false);
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [minConf, setMinConf] = useState(55); // upgraded default threshold
      const [holdProgress, setHoldProgress] = useState(0);
      const [correction, setCorrection] = useState("");
      const [showDiagnostics, setShowDiagnostics] = useState(true);

      const lastSignRef = useRef(null);
      const holdStartRef = useRef(null);

      useEffect(() => {
        return () => stopCamera();
      }, []);

      const startCamera = async () => {
        setLoading(true);
        setError(null);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
          });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            await videoRef.current.play();
          }
          setIsCameraActive(true);
          setLoading(false);

          // Initialize MediaPipe Hands
          if (window.Hands) {
            const hands = new window.Hands({
              locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            hands.setOptions({
              maxNumHands: 2,
              modelComplexity: 1,
              minDetectionConfidence: 0.60,
              minTrackingConfidence: 0.50
            });
            hands.onResults(handleResults);
            handsRef.current = hands;
          }

          startLoop();
        } catch (err) {
          console.error("Camera err:", err);
          setLoading(false);
          setIsCameraActive(false);
          setError(err.name === "NotAllowedError" ? "Camera permission was denied. Please allow access in browser settings." : err.message);
        }
      };

      const stopCamera = () => {
        if (animRef.current) cancelAnimationFrame(animRef.current);
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        if (videoRef.current) videoRef.current.srcObject = null;
        if (canvasRef.current) {
          const ctx = canvasRef.current.getContext('2d');
          ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);
        }
        setIsCameraActive(false);
        setHandDetected(false);
        setHoldProgress(0);
        setFps(0);
      };

      let frameCounter = 0;
      let lastFpsTime = performance.now();

      const startLoop = () => {
        const loop = async () => {
          if (!videoRef.current || videoRef.current.readyState < 2) {
            animRef.current = requestAnimationFrame(loop);
            return;
          }

          frameCounter++;
          const now = performance.now();
          if (now - lastFpsTime >= 1000) {
            setFps(frameCounter);
            frameCounter = 0;
            lastFpsTime = now;
          }

          // Use lock to ensure smooth non-blocking execution
          if (handsRef.current && !isProcessingFrameRef.current) {
            isProcessingFrameRef.current = true;
            try {
              await handsRef.current.send({ image: videoRef.current });
            } catch (e) {
            } finally {
              isProcessingFrameRef.current = false;
            }
          }

          animRef.current = requestAnimationFrame(loop);
        };
        animRef.current = requestAnimationFrame(loop);
      };

      const handleResults = (results) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        if (videoRef.current && (canvas.width !== videoRef.current.videoWidth || canvas.height !== videoRef.current.videoHeight)) {
          canvas.width = videoRef.current.videoWidth || 640;
          canvas.height = videoRef.current.videoHeight || 480;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          setHandDetected(true);
          const lm = results.multiHandLandmarks[0];
          const handedness = results.multiHandedness?.[0]?.label || "Right";

          drawNeonSkeleton(ctx, lm, canvas.width, canvas.height, handedness);

          const pred = classifyASLGesture(lm, handedness, minConf / 100);
          if (pred) {
            setPrediction(pred);
            if (pred.confidence >= minConf && pred.sign !== "Detecting...") {
              handleHoldToType(pred.sign, pred.confidence);
            } else {
              holdStartRef.current = null;
              setHoldProgress(0);
            }
          }
        } else {
          setHandDetected(false);
          holdStartRef.current = null;
          setHoldProgress(0);
          setPrediction({
            sign: "No Hand Detected",
            category: "none",
            confidence: 0,
            meaning: "Bring hand clearly into camera view.",
            handedness: "Right",
            fingerStates: null
          });
        }
      };

      const handleHoldToType = (signName, conf) => {
        if (lastSignRef.current !== signName) {
          lastSignRef.current = signName;
          holdStartRef.current = Date.now();
          setHoldProgress(0);
          return;
        }
        if (!holdStartRef.current) holdStartRef.current = Date.now();
        const elapsed = Date.now() - holdStartRef.current;
        const prog = Math.min(100, Math.round((elapsed / 1000) * 100));
        setHoldProgress(prog);

        if (prog >= 100) {
          commitSign(signName, conf);
          holdStartRef.current = Date.now() + 600;
          setHoldProgress(0);
        }
      };

      const commitSign = (s, conf = 95) => {
        if (soundEnabled) speechService.playChime();
        setSentence(prev => {
          if (!prev) return s;
          if (s.length > 1 || prev.endsWith(" ")) return prev + (prev.endsWith(" ") ? "" : " ") + s;
          return prev + s;
        });
      };

      const speakSentence = () => {
        if (!sentence.trim()) return;
        setIsSpeaking(true);
        speechService.speak(sentence, {
          onEnd: () => setIsSpeaking(false),
          onError: () => setIsSpeaking(false)
        });
        historyStorage.add({ text: sentence, confidence: prediction.confidence || 95, mode: "live_camera" });
      };

      const copySentence = () => {
        if (!sentence) return;
        navigator.clipboard.writeText(sentence);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">

          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-blue-900/40">
            <div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                Live Sign Language Recognition
              </h1>
              <p className="text-xs sm:text-sm text-blue-200 mt-1">
                Real-time 21-point hand tracking with instant ASL translation.
              </p>
            </div>
            <div className="flex items-center gap-2">
              <span className={`w-2.5 h-2.5 rounded-full ${isCameraActive ? 'bg-cyan-400 animate-pulse' : 'bg-slate-700'}`} />
              <span className="text-xs font-mono text-cyan-300 bg-[#050B1A] px-3 py-1.5 rounded-xl border border-blue-900/50">
                {isCameraActive ? `${fps} FPS Live` : 'Camera Standby'}
              </span>
            </div>
          </div>

          {/* Quick Sign Simulator / Instant Test Bar */}
          <div className="p-4 rounded-2xl bg-[#040814] border border-blue-900/50 space-y-2">
            <div className="flex items-center justify-between text-xs">
              <span className="font-semibold text-blue-300 flex items-center gap-1.5">
                <span>⚡</span> Quick Sign Test Bar (Click any to test instant recognition & voice):
              </span>
            </div>
            <div className="flex flex-wrap gap-2">
              {[
                { label: "🤟 I Love You", s: "I Love You" },
                { label: "👋 Hello", s: "Hello" },
                { label: "✌️ Peace/V", s: "V" },
                { label: "👍 Yes", s: "Yes" },
                { label: "👎 No", s: "No" },
                { label: "👌 OK", s: "OK" },
                { label: "✋ Stop", s: "Stop" },
                { label: "🆘 Help", s: "Help" },
                { label: "Letter L", s: "L" },
                { label: "Letter Y", s: "Y" },
                { label: "Letter A", s: "A" },
                { label: "Letter B", s: "B" },
                { label: "Letter C", s: "C" }
              ].map(b => (
                <button
                  key={b.s}
                  onClick={() => {
                    commitSign(b.s, 98);
                    setPrediction({
                      sign: b.s,
                      category: "phrase",
                      confidence: 98,
                      meaning: `Recognized '${b.s}'`,
                      handedness: "Right",
                      fingerStates: { thumb: "OPEN", index: "OPEN", middle: "OPEN", ring: "CLOSED", pinky: "OPEN" },
                      isRecognized: true
                    });

                  className="px-3 py-1.5 rounded-xl bg-blue-950/70 hover:bg-blue-900/80 border border-blue-700/40 text-xs font-medium text-blue-200 hover:text-white transition-all shadow-sm"

                    <p className="text-xs text-blue-200 mt-1">{prediction.meaning}</p>

                  <div className="text-right">
                    <span className="text-[10px] text-slate-400 uppercase block">Confidence</span>
                    <span className="text-2xl font-mono font-black text-cyan-300">{prediction.confidence}%</span>

    // --- 8. COMPONENT: LEARN SIGNS ACADEMY ---
    function LearnSigns({ soundEnabled }) {
      const [search, setSearch] = useState("");
      const [category, setCategory] = useState("all");
      const [activeModal, setActiveModal] = useState(null);

      // Camera Practice Mode States
      const [practiceItem, setPracticeItem] = useState(null);
      const [isPracticeOn, setIsPracticeOn] = useState(false);
      const [practiceMatch, setPracticeMatch] = useState(0);
      const [practiceSuccess, setPracticeSuccess] = useState(false);

      const pVideoRef = useRef(null);
      const pCanvasRef = useRef(null);
      const pStreamRef = useRef(null);
      const pAnimRef = useRef(null);
      const pHandsRef = useRef(null);

      const filtered = ASL_SIGNS.filter(s => {
        const catMatch = category === "all" || s.category === category;
        const qMatch = s.sign.toLowerCase().includes(search.toLowerCase()) ||
                       s.name.toLowerCase().includes(search.toLowerCase()) ||
                       s.summary.toLowerCase().includes(search.toLowerCase());
        return catMatch && qMatch;
      });

      useEffect(() => {
        return () => stopPractice();
      }, []);

      const startPractice = async (item) => {
        setPracticeItem(item);
        setPracticeMatch(0);
        setPracticeSuccess(false);
        setIsPracticeOn(true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
          });
          pStreamRef.current = stream;
          if (pVideoRef.current) {
            pVideoRef.current.srcObject = stream;
            await pVideoRef.current.play();
          }

          if (window.Hands) {
            const hands = new window.Hands({
              locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
            });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.60 });
            hands.onResults((res) => handlePracticeResults(res, item));
            pHandsRef.current = hands;
          }

          const loop = async () => {
            if (pVideoRef.current && pVideoRef.current.readyState >= 2 && pHandsRef.current) {
              try { await pHandsRef.current.send({ image: pVideoRef.current }); } catch (e) {}
            }
            pAnimRef.current = requestAnimationFrame(loop);
          };
          pAnimRef.current = requestAnimationFrame(loop);
        } catch (e) {
          console.error(e);
        }
      };

      const stopPractice = () => {
        if (pAnimRef.current) cancelAnimationFrame(pAnimRef.current);
        if (pStreamRef.current) {
          pStreamRef.current.getTracks().forEach(t => t.stop());
          pStreamRef.current = null;
        }
        if (pVideoRef.current) pVideoRef.current.srcObject = null;
        setIsPracticeOn(false);
        setPracticeItem(null);
      };

      const handlePracticeResults = (res, target) => {
        const canvas = pCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (pVideoRef.current && (canvas.width !== pVideoRef.current.videoWidth || canvas.height !== pVideoRef.current.videoHeight)) {
          canvas.width = pVideoRef.current.videoWidth || 640;
          canvas.height = pVideoRef.current.videoHeight || 480;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
          const lm = res.multiHandLandmarks[0];
          drawNeonSkeleton(ctx, lm, canvas.width, canvas.height, "Right");
          const pred = classifyASLGesture(lm, "Right");
          if (pred.sign.toLowerCase() === target.sign.toLowerCase()) {
            setPracticeMatch(96);
            setPracticeSuccess(true);
            if (soundEnabled) speechService.playChime();
          } else {
            setPracticeMatch(50);
            setPracticeSuccess(false);
          }
        } else {
          setPracticeMatch(0);
          setPracticeSuccess(false);
        }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">
          
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-blue-900/40">
            <div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                Sign Language Learning Academy
              </h1>
              <p className="text-xs sm:text-sm text-blue-200 mt-1">
                Explore ASL alphabet, numbers, greetings, and practice with real-time camera evaluation.
              </p>
            </div>
            <div className="relative min-w-[260px]">
              <input
                type="text"
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Search signs, letters, phrases..."
                className="w-full px-4 py-2 rounded-2xl bg-black border border-blue-900/60 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
              />
            </div>
          </div>

          <div className="flex flex-wrap gap-2">
            {CATEGORIES.map(c => (
              <button
                key={c.id}
                onClick={() => setCategory(c.id)}
                className={`px-4 py-2 rounded-xl text-xs font-semibold transition-all ${
                  category === c.id ? 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-md' : 'bg-[#040814] border border-blue-900/40 text-slate-300'
                }`}
              >
                {c.label}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            {filtered.map(item => (
              <div key={item.id} className="rounded-2xl p-5 bg-[#040814] border border-blue-900/40 hover:border-blue-500/50 transition-all flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-[10px] font-bold uppercase text-cyan-300 bg-blue-950 px-2 py-0.5 rounded border border-blue-800">{item.category}</span>
                    <span className="text-[10px] text-slate-500">{item.difficulty}</span>
                  </div>
                  <div className="w-16 h-16 mx-auto rounded-2xl bg-black border border-blue-800/40 flex items-center justify-center text-3xl font-black text-cyan-300 mb-3">
                    {item.sign}
                  </div>
                  <h3 className="text-sm font-bold text-white text-center mb-1">{item.name}</h3>
                  <p className="text-xs text-slate-400 text-center line-clamp-2 mb-4">{item.summary}</p>
                </div>
                <div className="space-y-2 pt-2 border-t border-blue-900/40">
                  <button
                    onClick={() => setActiveModal(item)}
                    className="w-full py-1.5 bg-[#0A1226] hover:bg-[#101C3D] text-slate-200 text-xs rounded-xl"
                  >
                    View Guide & Tips
                  </button>
                  <button
                    onClick={() => startPractice(item)}
                    className="w-full py-1.5 bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/30 text-cyan-300 text-xs rounded-xl font-medium"
                  >
                    Practice with Camera
                  </button>
                </div>
              </div>
            ))}
          </div>

          {/* Guide Modal */}
          {activeModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
              <div className="w-full max-w-md rounded-3xl p-6 bg-[#040814] border border-blue-600/40 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <span className="text-3xl font-black text-cyan-300">{activeModal.sign}</span>
                    <h2 className="text-lg font-bold text-white">{activeModal.name}</h2>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="p-1 rounded bg-black text-slate-300">✕</button>
                </div>
                <div className="p-4 rounded-xl bg-black text-xs text-slate-200 leading-relaxed border border-blue-900/40">
                  <strong className="text-cyan-300 block mb-1">How to form sign:</strong>
                  {activeModal.instructions}
                </div>
                <div className="p-4 rounded-xl bg-blue-950/40 text-xs text-slate-300 leading-relaxed border border-blue-700/40">
                  <strong className="text-blue-300 block mb-1">Tips for recognition:</strong>
                  {activeModal.tips}
                </div>
                <button
                  onClick={() => { const target = activeModal; setActiveModal(null); startPractice(target); }}
                  className="w-full py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold text-xs"
                >
                  Start Camera Practice Mode
                </button>
              </div>
            </div>
          )}

          {/* Practice Modal */}
          {isPracticeOn && practiceItem && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
              <div className="w-full max-w-xl rounded-3xl p-6 bg-[#040814] border border-blue-600/40 shadow-2xl space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-bold text-white">Practicing: {practiceItem.name}</h3>
                  <button onClick={stopPractice} className="p-1 rounded bg-black text-slate-300">✕</button>
                </div>
                <div className="relative aspect-[4/3] rounded-2xl overflow-hidden bg-black border border-blue-900/50">
                  <video ref={pVideoRef} playsInline muted className="w-full h-full object-cover scale-x-[-1]" />
                  <canvas ref={pCanvasRef} className="absolute inset-0 w-full h-full scale-x-[-1]" />
                  <div className="absolute top-4 left-4 right-4 flex items-center justify-between text-xs">
                    <span className={`px-3 py-1 rounded-full ${practiceSuccess ? 'bg-blue-950 text-cyan-300 border border-cyan-400 font-bold' : 'bg-black/80 text-white'}`}>
                      {practiceSuccess ? '✓ Great Job! Sign Matched!' : 'Align hand in frame'}
                    </span>
                    <span className="px-3 py-1 rounded-full bg-black font-mono text-cyan-300 font-bold border border-blue-800">
                      Match: {practiceMatch}%
                    </span>
                  </div>
                </div>
                <button onClick={stopPractice} className="w-full py-2 bg-[#0A1226] hover:bg-[#101C3D] rounded-xl text-xs font-semibold text-white">
                  Done Practicing
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // --- 9. COMPONENT: SPEECH CONVERTER ---
    function SpeechConverter() {
      const [isListening, setIsListening] = useState(false);
      const [transcript, setTranscript] = useState("");
      const [ttsText, setTtsText] = useState("");
      const [isSpeaking, setIsSpeaking] = useState(false);
      const [copied, setCopied] = useState(false);

      const recognitionRef = useRef(null);

      const toggleMic = () => {
        if (isListening) {
          if (recognitionRef.current) recognitionRef.current.stop();
          setIsListening(false);
        } else {
          const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SpeechRec) {
            alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
            return;
          }
          const rec = new SpeechRec();
          rec.continuous = true;
          rec.interimResults = true;
          rec.lang = "en-US";
          rec.onstart = () => setIsListening(true);
          rec.onend = () => setIsListening(false);
          rec.onresult = (e) => {
            let res = "";
            for (let i = e.resultIndex; i < e.results.length; ++i) {
              res += e.results[i][0].transcript;
            }
            setTranscript(p => p ? p + " " + res : res);
          };
          recognitionRef.current = rec;
          rec.start();
        }
      };

      const handleSpeak = (text = ttsText) => {
        if (!text.trim()) return;
        setIsSpeaking(true);
        speechService.speak(text, {
          onEnd: () => setIsSpeaking(false),
          onError: () => setIsSpeaking(false)
        });
        historyStorage.add({ text, confidence: 100, mode: "text_to_speech" });
      };

      const quicks = [
        "Hello! Nice to meet you.",
        "I am deaf / hard of hearing. Thank you for your patience.",
        "Could you please speak into this microphone?",
        "Where is the nearest exit?",
        "Thank you very much for your help!"
      ];

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">
          <div className="pb-4 border-b border-blue-900/40">
            <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
              Two-Way Speech & Text Bridge
            </h1>
            <p className="text-xs sm:text-sm text-blue-200 mt-1">
              Spoken conversation translated to text for deaf readers, and text converted into speech for hearing listeners.
            </p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            {/* STT Panel */}
            <div className="rounded-3xl p-6 bg-[#040814] border border-blue-600/30 shadow-xl space-y-4 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between pb-3 border-b border-blue-900/40 mb-4">
                  <h3 className="text-base font-bold text-white">Speech to Text (Listen)</h3>
                  <span className="text-xs font-mono text-cyan-300 bg-blue-950 px-2 py-0.5 rounded border border-blue-800">
                    {isListening ? "Listening Active" : "Standby"}
                  </span>
                </div>
                <div className="min-h-[160px] p-4 rounded-2xl bg-black border border-blue-900/40 text-sm text-white">
                  {transcript || <span className="text-slate-500 italic">Click the mic below and speak into your microphone...</span>}
                </div>
              </div>
              <div className="flex items-center gap-3 pt-4 border-t border-blue-900/40">
                <button
                  onClick={toggleMic}
                  className={`flex-1 py-3.5 rounded-2xl font-bold text-xs shadow-lg transition-all ${
                    isListening ? 'bg-rose-600 text-white animate-pulse' : 'bg-gradient-to-r from-blue-600 to-cyan-500 text-white'
                  }`}
                >
                  {isListening ? "Stop Microphone" : "🎙️ Speak into Microphone"}
                </button>
                <button
                  onClick={() => { navigator.clipboard.writeText(transcript); setCopied(true); setTimeout(() => setCopied(false), 2000); }}
                  disabled={!transcript}
                  className="p-3.5 rounded-2xl bg-[#0A1226] text-xs text-slate-300 disabled:opacity-40"
                >
                  {copied ? "✓" : "📋"}
                </button>
                <button onClick={() => setTranscript("")} disabled={!transcript} className="p-3.5 rounded-2xl bg-[#0A1226] text-xs text-rose-400 disabled:opacity-40">
                  🗑️
                </button>
              </div>
            </div>

            {/* TTS Panel */}
            <div className="rounded-3xl p-6 bg-[#040814] border border-blue-600/30 shadow-xl space-y-4 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between pb-3 border-b border-blue-900/40 mb-4">
                  <h3 className="text-base font-bold text-white">Text to Speech (Speak Aloud)</h3>
                  <span className="text-xs font-mono text-blue-300">Web Speech API</span>
                </div>
                <textarea
                  rows={4}
                  value={ttsText}
                  onChange={(e) => setTtsText(e.target.value)}
                  placeholder="Type anything here to be spoken out loud..."
                  className="w-full p-4 rounded-2xl bg-black border border-blue-900/40 text-sm text-white placeholder-slate-500 focus:outline-none resize-none"
                />
                <div className="mt-3">
                  <span className="text-[10px] font-semibold text-blue-300 uppercase block mb-1.5">Quick Phrases</span>
                  <div className="flex flex-wrap gap-1.5">
                    {quicks.map((q, i) => (
                      <button
                        key={i}
                        onClick={() => { setTtsText(q); handleSpeak(q); }}
                        className="px-2.5 py-1 rounded-lg bg-[#0A1226] hover:bg-[#101C3D] text-[11px] text-slate-300 hover:text-white border border-blue-900/40"
                      >
                        {q}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
              <div className="pt-4 border-t border-blue-900/40">
                <button
                  onClick={() => handleSpeak()}
                  disabled={!ttsText.trim() || isSpeaking}
                  className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-blue-600 via-blue-500 to-cyan-500 text-white font-bold text-xs shadow-lg disabled:opacity-40"
                >
                  {isSpeaking ? "🔊 Speaking..." : "🔊 Speak Text Aloud"}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- 10. COMPONENT: HISTORY PAGE ---
    function HistoryPage({ setActivePage }) {
      const [items, setItems] = useState([]);
      const [search, setSearch] = useState("");

      useEffect(() => {
        setItems(historyStorage.get());
      }, []);

      const handleDelete = (id) => {
        setItems(historyStorage.delete(id));
      };

      const handleClear = () => {
        if (confirm("Clear translation history?")) {
          setItems(historyStorage.clear());
        }
      };

      const filtered = items.filter(i => i.text.toLowerCase().includes(search.toLowerCase()));

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-blue-900/40">
            <div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Translation History</h1>
              <p className="text-xs sm:text-sm text-blue-200 mt-1">Review past sign translations and speech logs.</p>
            </div>
            <button onClick={handleClear} disabled={items.length === 0} className="px-3.5 py-2 rounded-xl bg-rose-600/20 text-rose-300 text-xs font-semibold disabled:opacity-40">
              Clear All History
            </button>
          </div>

          <div className="max-w-md">
            <input
              type="text"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Search past translations..."
              className="w-full px-4 py-2 rounded-xl bg-black border border-blue-900/60 text-xs text-white"
            />
          </div>

          <div className="space-y-3">
            {filtered.map(item => (
              <div key={item.id} className="p-4 rounded-2xl bg-[#040814] border border-blue-900/40 flex items-center justify-between gap-4">
                <div>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-[10px] font-bold uppercase text-cyan-300 bg-blue-950 px-2 py-0.5 rounded border border-blue-800">{item.mode}</span>
                    <span className="text-xs text-slate-400">{item.timestamp}</span>
                    <span className="text-xs font-mono text-blue-300">{item.confidence}% Conf.</span>
                  </div>
                  <p className="text-sm font-semibold text-white">"{item.text}"</p>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={() => speechService.speak(item.text)} className="p-2 rounded bg-black text-xs text-cyan-300">🔊</button>
                  <button onClick={() => navigator.clipboard.writeText(item.text)} className="p-2 rounded bg-black text-xs text-slate-300">📋</button>
                  <button onClick={() => handleDelete(item.id)} className="p-2 rounded bg-black text-xs text-rose-400">🗑️</button>
                </div>
              </div>
            ))}
            {filtered.length === 0 && (
              <div className="text-center py-12 text-slate-500 text-xs">No translation records found.</div>
            )}
          </div>
        </div>
      );
    }

    // --- 11. COMPONENT: ABOUT PAGE ---
    function AboutPage({ setActivePage }) {
      return (
        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-10">
          <div className="pb-4 border-b border-blue-900/40">
            <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">About SignaBridge AI</h1>
            <p className="text-xs sm:text-sm text-blue-200 mt-1">Inclusive technology designed for human connection in Electric Blue & Black.</p>
          </div>

          <section className="p-6 rounded-3xl bg-[#040814] border border-blue-900/40 space-y-3">
            <h2 className="text-lg font-bold text-white">Mission Statement</h2>
            <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
              Over 466 million people globally experience disabling hearing loss. SignaBridge AI bridges this gap through real-time hand gesture recognition and speech conversion, requiring only a modern web browser and a webcam.
            </p>
          </section>

          <section className="p-6 rounded-3xl bg-[#040814] border border-blue-900/40 space-y-4">
            <h2 className="text-lg font-bold text-white">AI & Computer Vision Architecture</h2>
            <div className="p-4 rounded-xl bg-black font-mono text-xs text-blue-200 leading-relaxed border border-blue-900/60">
              [Live Webcam] → [MediaPipe Hands 21 3D Points] → [Wrist-Normalized Scale Vector Space] → [Multi-Factor Joint Angle & Ratio Classifier] → [Sentence Builder] → [Web Speech Synthesis]
            </div>
            <p className="text-xs text-slate-400">
              Landmark coordinates are normalized relative to the wrist and scaled by hand size, ensuring invariant classification across different user distances and hand anatomies.
            </p>
          </section>

          <section className="p-6 rounded-3xl bg-[#040814] border border-blue-900/40 space-y-3">
            <h2 className="text-lg font-bold text-white">Custom Model Training & Dataset Schema</h2>
            <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
              The project includes a Python FastAPI backend and dataset collection tools in <code>/ai_model</code> and <code>/backend</code>.
            </p>
            <div className="p-4 rounded-xl bg-black font-mono text-xs text-cyan-300 border border-blue-900/60">
              # Collect hand landmarks:<br />
              python ai_model/data_collector.py<br /><br />
              # Train custom Random Forest model:<br />
              python ai_model/train_model.py
            </div>
          </section>
        </div>
      );
    }

    // --- 12. COMPONENT: FOOTER ---
    function Footer({ setActivePage }) {
      return (
        <footer className="border-t border-blue-900/40 bg-black/95 mt-20">
          <div className="max-w-7xl mx-auto px-4 py-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400 gap-4">
            <div className="flex items-center gap-2">
              <span>🤟</span>
              <span className="font-bold text-white">SignaBridge AI</span>
              <span>– Electric Blue & Black Edition</span>
            </div>
            <p>© {new Date().getFullYear()} SignaBridge AI. Built for accessible human communication.</p>
          </div>
        </footer>
      );
    }

    // --- 13. MAIN APP ROOT ---
    function App() {
      const [activePage, setActivePage] = useState('home');
      const [soundEnabled, setSoundEnabled] = useState(true);

      useEffect(() => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [activePage]);

      return (
        <div className="min-h-screen text-slate-100 flex flex-col bg-black">
          <Navbar
            activePage={activePage}
            setActivePage={setActivePage}
            soundEnabled={soundEnabled}
            setSoundEnabled={setSoundEnabled}
          />

          <main className="flex-1">
            {activePage === 'home' && <HeroSection setActivePage={setActivePage} />}
            {activePage === 'translator' && <LiveTranslator soundEnabled={soundEnabled} />}
            {activePage === 'learn' && <LearnSigns soundEnabled={soundEnabled} />}
            {activePage === 'speech' && <SpeechConverter />}
            {activePage === 'history' && <HistoryPage setActivePage={setActivePage} />}
            {activePage === 'about' && <AboutPage setActivePage={setActivePage} />}
          </main>

          <Footer setActivePage={setActivePage} />
        </div>
      );
    }

    // Render application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
